name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Enforces the coverage thresholds in vitest.config.ts (src/lib 100%, UI floor)
      - run: npm run test:coverage
      # The build does not need Supabase env vars (the client is created on first use)
      - run: npm run build
