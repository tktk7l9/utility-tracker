name: Supabase keep-alive

# The Supabase free plan pauses a project automatically after a week without DB queries.
# Utility bills are entered only about once a month, so left alone it is paused every time and login
# fails with "Failed to fetch" (the DNS for <ref>.supabase.co disappears while paused).
# The official guideline is "a few requests a day", so read readings over REST once a day.
# RLS returns 0 rows to anon, but the query itself still runs in the DB.
# If the project is paused, fail the job so GitHub's failure email tells us.

on:
  schedule:
    - cron: "17 21 * * *" # Daily at 06:17 JST. The top of the hour is busy on GitHub and often delayed
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query readings via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -m 30 --retry 3 --retry-delay 10 -o response.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/readings?select=id&limit=1") || status=000
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase が HTTP $status を返しました。000 は停止中（DNS なし）の可能性が高いので Dashboard から Restore してください"
            cat response.json 2>/dev/null || true
            exit 1
          fi
